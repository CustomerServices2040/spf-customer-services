<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Busola 2.0 | معاينة الاعتماد</title><style>
*{box-sizing:border-box}body{margin:0;background:#101F1A;color:#f7f7f3;font:15px Tahoma,sans-serif}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #546C60;background:#1D352B}header strong{margin-inline-end:auto}small{color:#CBD8D0}button,select,a{font:inherit;border:1px solid #718A7D;border-radius:9px;padding:9px 12px;color:#F7F7F3;background:#304C41}button{cursor:pointer}button:hover{border-color:#CCA862}#open{background:#CCA862;color:#243F36;text-decoration:none;font-weight:bold}#stage{direction:ltr;overflow:hidden;position:relative;padding:0}iframe{display:block;flex:none;border:0;margin:0;position:absolute;top:0;transform-origin:top left;background:#243F36;width:1440px;height:1000px;box-shadow:0 8px 40px #0004}#note{padding:8px 20px;line-height:1.8;color:#D5E0D9}details{padding:16px 20px}#log{direction:ltr;text-align:left;white-space:pre-wrap;max-height:280px;overflow:auto;background:#162A22;padding:16px;font:12px monospace}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#status{padding:12px 20px}#run{background:#CCA862;color:#243F36}progress{accent-color:#CCA862;width:180px}@media(max-width:600px){header{padding:12px;gap:8px}header strong{width:100%}select{max-width:100%}#stage{padding:0}iframe{height:850px}}
</style></head><body><header><strong>بوصلة المتعامل <small>Design System 2.0 · معاينة للاعتماد</small></strong><a id="open" href="after/index.html#overview" target="_blank">فتح المنصة كاملة ↗</a><select id="version" aria-label="النسخة"><option value="after">بعد التطوير</option><option value="before">قبل التطوير</option></select><select id="theme" aria-label="النمط"><option value="green">الأخضر المؤسسي</option><option value="navy">الأزرق التنفيذي</option><option value="burgundy">العنابي المؤسسي</option><option value="original">الأصلي</option></select><select id="width" aria-label="عرض الشاشة"><option value="1440">كمبيوتر · 1440</option><option value="390">هاتف · 390</option><option value="768">لوحي · 768</option><option value="1920">شاشة كبيرة · 1920</option></select><select id="page" aria-label="القسم"><option value="overview">نظرة عامة</option></select><select id="surface" aria-label="العرض"><option value="index.html">المنصة</option><option value="leadership.html">العرض القيادي</option><option value="forum/index.html">ملتقى المحافظات</option><option value="reports/community-communication-plan-2026.html">خطة التواصل المجتمعي</option><option value="reports/dakhiliyah-june-2026.html">تقرير الداخلية</option></select></header><div id="note">معاينة مستقلة للمراجعة. اختر النمط والمقاس، أو افتح المنصة كاملة لتجربة الأدوات. المحتوى المحمي يحتفظ بكلمة مروره، والنشر الخارجي معطّل في هذه الحزمة.</div><div id="ready" role="status"></div><div id="stage"><iframe id="subject" allowfullscreen title="النسخة التجريبية الكاملة" src="after/index.html#overview"></iframe></div><details><summary>فحص التغطية والتوافق</summary><div class="bar"><button id="run">فحص جميع التبويبات والأنماط والمقاسات</button><button id="stop">إيقاف</button><button id="download">تنزيل تقرير الفحص</button><progress id="progress" max="448" value="0"></progress></div><div id="status" role="status">جاهز للفحص</div><pre id="log"></pre></details><script>
const $=s=>document.querySelector(s),frame=$('#subject');let results=[],stop=false,running=false;
const qaParams=new URLSearchParams(location.search);const pause=ms=>new Promise(r=>setTimeout(r,ms));const settle=async()=>{await pause(1200);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))};
const d=()=>frame.contentDocument,w=()=>frame.contentWindow;
function ready(){const token=$('#page').value;$('#ready').textContent='';setTimeout(()=>{$('#ready').textContent='جاهز · '+token},1800)}
function theme(){const b=d().querySelector('[data-theme="'+$('#theme').value+'"]');if(b)b.click();const motion=d().querySelector('[name=motion]');if(motion){motion.value='off';motion.dispatchEvent(new Event('input',{bubbles:true}))}d().querySelector('.as-close')?.click();ready();}
function size(){const width=+$('#width').value,scale=Math.min(1,$('#stage').clientWidth/width);frame.style.width=width+'px';frame.width=width;frame.style.transform='scale('+scale+')';frame.style.left=Math.max(0,($('#stage').clientWidth-width*scale)/2)+'px';$('#stage').style.height=(1000*scale)+'px'}window.addEventListener('resize',size)
function load(){const path=$('#version').value+'/'+$('#surface').value;frame.src=path+($('#surface').value==='index.html'?'#'+$('#page').value:'');$('#open').href=frame.src}
$('#version').onchange=load;$('#surface').onchange=load;$('#width').onchange=size;$('#theme').onchange=theme;
$('#page').onchange=()=>{if($('#page').value.startsWith('communications/')){w().location.hash='communications';const r=d().querySelector('#communications-app')?.shadowRoot;r?.querySelector('[data-page="'+$('#page').value.split('/')[1]+'"]')?.click()}else w().location.hash=$('#page').value;ready();};
frame.onload=async()=>{await pause(600);theme();const links=[...d().querySelectorAll('.top-navigation a[href^="#"]')];if(links.length){const value=$('#page').value;$('#page').innerHTML=links.map(a=>'<option value="'+a.hash.slice(1)+'">'+a.textContent+'</option>').join('');$('#page').value=value||'overview';for(const [key,label]of [['intro','نبذة عامة'],['strategy','التوجه الاستراتيجي'],['channels','المنصات والوصول'],['community','التواصل المجتمعي'],['performance','الأداء والمؤشرات'],['coordination','التحديات والتكامل'],['savings','نظام الادخار']])$('#page').insertAdjacentHTML('beforeend','<option value="communications/'+key+'">التواصل والإعلام · '+label+'</option>')}};
function roots(){return[d(),...[...d().querySelectorAll('*')].filter(e=>e.shadowRoot).map(e=>e.shadowRoot)]}
function inspect(theme,width,page){const doc=d(),win=w(),C=win.BusolaContrast,cache=new WeakMap(),clipped=[],contrast=[],cards=[];for(const root of roots())for(const e of root.querySelectorAll('*')){if(!e.getClientRects().length||!e.checkVisibility({checkOpacity:true,checkVisibilityCSS:true})||e.closest('#appearance-studio,svg,.bt-picker'))continue;const s=win.getComputedStyle(e),r=e.getBoundingClientRect();if(s.visibility==='hidden'||+s.opacity===0)continue;if(e.dataset.bsComponent)cards.push({family:e.dataset.bsComponent,surface:e.dataset.bsSurface});if(e.matches('h1,h2,h3,p,[data-bs-kpi],td,th')&&r.width>0&&e.clientWidth>0&&!['auto','scroll'].includes(s.overflowX)&&s.display!=='inline'&&e.scrollWidth>e.clientWidth+5)clipped.push({selector:e.id?'#'+e.id:e.tagName+'.'+String(e.className).split(' ').join('.'),text:e.textContent.trim().slice(0,70),width:e.clientWidth,scroll:e.scrollWidth});if(theme!=='original'&&C&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())&&!e.matches('script,style,option')){const fg=C.parse(s.color),min=parseFloat(s.fontSize)>=24||(+s.fontWeight>=700&&parseFloat(s.fontSize)>=18.66)?3:4.5;if(fg){const meter=e.closest('.operation-meter');const meterBG=meter&&C.parse(win.getComputedStyle(meter,'::before').backgroundColor);const score=C.score(fg,meterBG&&meterBG[3]!==0?[meterBG]:C.background(e,cache));if(score<min)contrast.push({selector:e.id?'#'+e.id:e.tagName+'.'+String(e.className).split(' ').join('.'),text:e.textContent.trim().slice(0,50),score:+score.toFixed(2),min})}}}
return {theme,width,page,actual:doc.documentElement.dataset.busolaTheme,overflow:doc.documentElement.scrollWidth-doc.documentElement.clientWidth,clipped,contrast,cards,protected:!!doc.getElementById(page)?.classList.contains('spf-encrypted-tab'),kpis:[...doc.querySelectorAll('[data-bs-kpi]')].filter(e=>e.getClientRects().length).map(e=>({tier:e.dataset.bsKpi,value:e.textContent.trim(),size:win.getComputedStyle(e).fontSize}))}}
$('#stop').onclick=()=>stop=true;
$('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({timestamp:new Date().toISOString(),results},null,2)],{type:'application/json'}));a.download='Busola_2_QA.json';a.click()};
$('#run').onclick=async()=>{if(running)return;running=true;stop=false;results=[];$('#run').disabled=true;try{const chapters=[...new Set([...d().querySelectorAll('.top-navigation a[href^="#"]')].map(a=>a.hash.slice(1)))];if(!chapters.length)throw Error('اختر المنصة أولاً');for(const width of (qaParams.has('width')?[Number(qaParams.get('width'))]:[390,768,1440,1920])){frame.style.width=width+'px';for(const t of (qaParams.has('theme')?[qaParams.get('theme')]:['original','green','navy','burgundy'])){d().querySelector('[data-theme="'+t+'"]')?.click();const motion=d().querySelector('[name=motion]');if(motion){motion.value='off';motion.dispatchEvent(new Event('input',{bubbles:true}))}d().querySelector('.as-close')?.click();for(const chapter of chapters){if(stop)throw Error('توقف الفحص');w().location.hash=chapter;await settle();results.push(inspect(t,width,chapter));if(chapter==='communications'){const root=d().querySelector('#communications-app')?.shadowRoot;for(const sub of ['intro','strategy','channels','community','performance','coordination','savings']){root?.querySelector('[data-page="'+sub+'"]')?.click();await settle();results.push(inspect(t,width,'communications/'+sub))}}$('#progress').value=results.length;$('#status').textContent='تم فحص '+results.length+' حالة · '+t+' · '+width+' · '+chapter;$('#log').textContent=JSON.stringify({count:results.length,overflow:results.filter(r=>r.overflow>3).length,clipped:results.filter(r=>r.clipped.length).length,contrast:results.filter(r=>r.contrast.length).length,last:results.at(-1)},null,2)}}}$('#status').textContent='اكتمل فحص '+results.length+' حالة';}catch(e){$('#status').textContent=e.message}finally{running=false;$('#run').disabled=false;size();theme();w().location.hash='overview'}};
size();
</script></body></html>
