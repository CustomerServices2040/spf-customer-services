name: Deploy both public dashboards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard files
        uses: actions/checkout@v4

      - name: Prepare current and restored dashboards
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          site = Path("_site")
          legacy = site / "legacy"
          legacy.mkdir(parents=True, exist_ok=True)
          (site / "index.html").write_bytes(Path("index.html").read_bytes())
          (site / ".nojekyll").write_text("", encoding="utf-8")

          base = "https://spf-customer-services-gallery.spf2040.chatgpt.site/"
          files = [
              "index.html",
              "assets/app.js",
              "assets/channels/ai-assistant.png",
              "assets/channels/contact-center.png",
              "assets/channels/facebook.png",
              "assets/channels/himaya-app.png",
              "assets/channels/instagram.png",
              "assets/channels/oman-governorates.png",
              "assets/channels/tajawob.png",
              "assets/channels/web-portal.png",
              "assets/channels/whatsapp.png",
              "assets/channels/x.png",
              "assets/data.js",
              "assets/excel-import.js",
              "assets/executive-mode.js",
              "assets/exhibition.css",
              "assets/exhibition.js",
              "assets/model-branch-poster.jpg",
              "assets/model-branch.mp4",
              "assets/oman-governorates-map.png",
              "assets/spf-logo.png",
              "assets/styles.css",
              "assets/work-tracker.html",
              "assets/قالب تحديث منصة خدمات المتعاملين.xlsx",
          ]

          for item in files:
              target = legacy / item
              target.parent.mkdir(parents=True, exist_ok=True)
              request = Request(base + quote(item, safe="/"), headers={"User-Agent": "SPF-Dashboard-Deployment/1.0"})
              with urlopen(request, timeout=120) as response:
                  target.write_bytes(response.read())
              print(f"Restored {item}")

      - name: Apply the last saved repository updates to restored platform
        shell: bash
        run: |
          cp -R overrides/. _site/legacy/
          python patches/patch_index.py _site/legacy/index.html

      - name: Validate deployed platform
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/legacy/assets/app.js
          node --check _site/legacy/assets/exhibition.js
          node --check _site/legacy/assets/platform-enhancements.js
          node --check _site/legacy/assets/privacy-lock.js
          node --check _site/legacy/assets/plan-data-2026.js
          node --check _site/legacy/assets/excel-import.js
          node --check _site/legacy/assets/executive-mode.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          html_path = Path("_site/legacy/index.html")
          text = html_path.read_text(encoding="utf-8")

          required_tabs = [
              "overview","directorate","methodology","coverage","channels",
              "operational-plan","work-tracker","risk-register","performance",
              "tajawob","committees","projects","community-line","media-center","achievements"
          ]

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
                  self.nav=[]
                  self.scripts=[]
                  self.styles=[]
                  self.in_nav=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if "id" in a:
                      self.ids.append(a["id"])
                  if tag=="nav" and "top-navigation" in a.get("class","").split():
                      self.in_nav=True
                  if self.in_nav and tag=="a" and a.get("href","").startswith("#"):
                      self.nav.append(a["href"][1:])
                  if tag=="script" and a.get("src"):
                      self.scripts.append(a["src"])
                  if tag=="link" and a.get("rel")=="stylesheet" and a.get("href"):
                      self.styles.append(a["href"])
              def handle_endtag(self, tag):
                  if tag=="nav" and self.in_nav:
                      self.in_nav=False

          audit=Audit()
          audit.feed(text)
          ids=set(audit.ids)
          missing=[tab for tab in required_tabs if tab not in ids]
          missing_nav=[tab for tab in required_tabs if tab not in audit.nav]
          duplicate_ids=sorted({x for x in audit.ids if audit.ids.count(x)>1})

          if missing:
              raise SystemExit(f"Missing required tab sections: {missing}")
          if missing_nav:
              raise SystemExit(f"Missing required navigation links: {missing_nav}")
          if duplicate_ids:
              raise SystemExit(f"Duplicate HTML ids found: {duplicate_ids[:20]}")
          if audit.nav != required_tabs:
              raise SystemExit(f"Navigation order mismatch: {audit.nav}")

          revision = __import__("os").environ["GITHUB_SHA"][:12]
          expected_navigation_css = f"assets/navigation-reliability.css?v={revision}"
          if not audit.styles or audit.styles[-1] != expected_navigation_css:
              raise SystemExit("RTL navigation override must load after all other styles")
          if any(f"?v={revision}" not in asset for asset in audit.scripts + audit.styles):
              raise SystemExit("All runtime assets must use the current commit revision")
          nav_css = (html_path.parent / "assets/navigation-reliability.css").read_text()
          if "justify-content: flex-start" not in nav_css or "direction: rtl" not in nav_css:
              raise SystemExit("RTL navigation must start on the right")

          for asset in audit.scripts + audit.styles:
              parsed=urlparse(asset)
              if parsed.scheme or asset.startswith("//"):
                  continue
              rel=parsed.path.lstrip("/")
              target=html_path.parent / rel
              if not target.exists():
                  raise SystemExit(f"Referenced asset does not exist: {asset}")

          for report in ("reports/q1-2026.pdf", "reports/q2-2026.pdf"):
              target=html_path.parent / report
              if f'href="{report}"' not in text or not target.is_file():
                  raise SystemExit(f"Quarterly report link or file missing: {report}")
              if target.stat().st_size < 1_000_000 or target.open("rb").read(4) != b"%PDF":
                  raise SystemExit(f"Quarterly report is not a complete PDF: {report}")

          dakhiliyah_report = html_path.parent / "reports/dakhiliyah-june-2026.html"
          if not dakhiliyah_report.is_file() or dakhiliyah_report.stat().st_size < 1_000_000:
              raise SystemExit("Dakhiliyah June 2026 report is missing or incomplete")
          report_text = dakhiliyah_report.read_text(encoding="utf-8")
          expected_report_title = "تقرير دائرة الحماية الاجتماعية بمحافظة الداخلية يونيو 2026"
          if f"<title>{expected_report_title}</title>" not in report_text:
              raise SystemExit("Dakhiliyah report title is incorrect")
          if "الهيكل الإداري للدائرة" in report_text or 'class="org-section"' in report_text:
              raise SystemExit("Dakhiliyah organisation/employee slide was not removed")
          enhancement_js = (html_path.parent / "assets/platform-enhancements.js").read_text(encoding="utf-8")
          if "reports/dakhiliyah-june-2026.html" not in enhancement_js or expected_report_title not in enhancement_js:
              raise SystemExit("Dakhiliyah report link is missing from the governorate panel")

          if "316" in text:
              raise SystemExit("Deprecated community total 316 still exists in generated page")
          if text.count('id="community-line"') != 1 or text.count('id="media-center"') != 1:
              raise SystemExit("Community/media chapters must appear exactly once")

          print("Platform audit passed")
          print("Tabs:", len(required_tabs))
          print("Scripts:", len(audit.scripts))
          print("Styles:", len(audit.styles))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload both dashboards
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboards
        id: deployment
        uses: actions/deploy-pages@v4
