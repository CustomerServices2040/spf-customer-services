<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر المراجعة البصرية | بوصلة المتعامل</title><style>body{font:16px Tahoma;background:#edf2ee;margin:0;color:#243f36}header{padding:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#243f36;color:white}button,select,a{font:inherit;padding:10px;border-radius:8px;border:1px solid #cca862;background:white;color:#243f36}#stage{direction:ltr;overflow:auto;padding:10px}iframe{border:1px solid #aaa;display:block;margin:auto;background:white}#log{font:12px monospace;white-space:pre-wrap;direction:ltr;max-height:300px;overflow:auto;background:white;padding:15px}#status{padding:12px}details{padding:12px}</style><header><b>مختبر المراجعة البصرية</b><a href="index.html">العودة للمعاينة</a><select id="width"><option>1440</option><option>390</option><option>768</option><option>1920</option></select><select id="page"><option value="index.html#overview">المنصة</option><option value="reports/community-communication-plan-2026.html">خطة التواصل المجتمعي</option><option value="forum/index.html">ملتقى المحافظات</option></select><select id="scope"><option value="full">فحص شامل</option><option value="focused">إعادة فحص الهاتف واللوحي</option></select><button id="run">فحص جميع التبويبات والأنماط</button><button id="stop">إيقاف الفحص</button><button id="download">تنزيل نتائج المراجعة</button></header><div id="status" role="status">جاهز؛ المعاينة لا تنشر على الموقع الرسمي.</div><div id="stage"><iframe id="subject" title="المنصة قيد المراجعة" src="index.html#overview" width="1440" height="1000"></iframe></div><details open><summary>نتائج الاختبارات</summary><pre id="log"></pre></details><script>
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),log=document.querySelector('#log'),results=[];let stop=false;const pause=async ms=>{await new Promise(r=>setTimeout(r,ms));await new Promise(r=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(r)))},doc=()=>frame.contentDocument,win=()=>frame.contentWindow;
const report=r=>{results.push(r);log.textContent=JSON.stringify(results,null,2);status.textContent='تم فحص '+results.length+' حالة • ملاحظات: '+results.filter(x=>x.overflow>3||x.error||x.clipped?.length).length;};
document.querySelector('#width').onchange=e=>frame.width=e.target.value;document.querySelector('#page').onchange=e=>frame.src=e.target.value;document.querySelector('#stop').onclick=()=>stop=true;document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));a.download='appearance-review-results.json';a.click()};
function input(selector,value){const e=doc().querySelector(selector);if(!e)throw Error('Missing '+selector);e.value=value;e.dispatchEvent(new Event('input',{bubbles:true}));}
function click(selector){doc().querySelector(selector)?.click()}
function inspect(theme,width,variant,page){const d=doc(),w=win(),roots=[d,...[...d.querySelectorAll('*')].filter(e=>e.shadowRoot).map(e=>e.shadowRoot)],off=[];for(const root of roots)for(const e of root.querySelectorAll('h1,h2,h3,h4,p,strong,b,td,th')){if(!e.getClientRects().length||e.closest('#appearance-studio'))continue;const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);if(r.width>0&&s.overflow!=='auto'&&s.overflowX!=='scroll'&&e.scrollWidth>e.clientWidth+5&&e.clientWidth>0&&s.display!=='inline')off.push({tag:e.tagName,cls:e.className,text:e.textContent.trim().slice(0,60),width:e.clientWidth,scroll:e.scrollWidth});}return {theme,actualTheme:d.documentElement.dataset.busolaTheme,width,variant,page,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,clipped:off.slice(0,8),locked:!!d.getElementById(page)?.classList.contains('spf-encrypted-tab'),palette:!!d.querySelector('.as-palette')};}
document.querySelector('#run').onclick=async()=>{stop=false;results.length=0;document.querySelector('#run').disabled=true;try{
 if(!frame.src.includes('index.html')){frame.src='index.html#overview';await pause(2000)}
 const focused=document.querySelector('#scope').value==='focused';let chapters=[...new Set([...doc().querySelectorAll('.ux-nav-groups a[href^="#"]')].map(e=>e.hash.slice(1)))];if(focused)chapters=chapters.filter(x=>['channels','contact-center','tajawob','communications'].includes(x));
 for(const width of (focused?[390,768]:[1440,390,768,1920])){frame.width=width;await pause(150);for(const theme of ['original','green','navy','burgundy']){click('#as-original');click('[data-theme="'+theme+'"]');await pause(200);
 for(const variant of (focused?['small-plex','large-noto']:['base','small-plex','large-noto'])){click('#as-reset');if(variant!=='base'){input('[name=font]',variant==='small-plex'?'plex':'noto');input('[name=scale]',variant==='small-plex'?.9:1.3);input('[name=numbers]',variant==='small-plex'?.85:1.3);click('[data-card="'+(variant==='small-plex'?'classic':'soft')+'"]');input('[name=motion]','off');}await pause(200);
 for(const page of chapters){if(stop)throw Error('Stopped');win().location.hash=page;await pause(180);report(inspect(theme,width,variant,page));if(page==='communications'){const root=doc().querySelector('#communications-app')?.shadowRoot;for(const tab of ['intro','strategy','channels','community','performance','coordination','savings']){root?.querySelector('[data-page="'+tab+'"]')?.click();await pause(150);report(inspect(theme,width,variant,'communications/'+tab));}}}
 }} }
 status.textContent+=' • اكتمل الفحص';
}catch(e){report({error:e.message})}finally{document.querySelector('#run').disabled=false;click('#as-original');frame.width=1440;win().location.hash='overview';}}
</script></html>
